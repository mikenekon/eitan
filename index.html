<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="えいたん">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F2F6F8">
<meta name="color-scheme" content="light">
<title>えいたん</title>
<style>
:root{
  --paper:#F2F6F8; --grid:#DCE7ED; --ink:#16264A; --soft:#5B6B8C; --line:#C5D3DD;
  --mark:#FFE35A; --sheet:#E5484D; --ok:#178A5F; --okbg:#DDF3E8; --bad:#C93A3F; --badbg:#FBE3E3;
  --r:14px;
  --en:"Avenir Next","Futura","Helvetica Neue",Arial,sans-serif;
  --jp:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);font-family:var(--jp);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%;
}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 14px)}
.screen{flex:1;display:flex;flex-direction:column;gap:14px}
.grow{flex:1}
button,input,textarea{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #2F6BFF;outline-offset:2px}

.top{display:flex;align-items:center;gap:12px}
.ttl{flex:1;font-weight:800;font-size:18px}
.pos{font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.x{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:22px;line-height:1;padding:0}
.strip{display:flex;gap:4px}
.strip i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.strip i.done{background:var(--ink)}
.strip i.now{background:var(--mark);box-shadow:0 0 0 2px var(--ink)}

.btn{appearance:none;-webkit-appearance:none;border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r);
  min-height:54px;padding:10px 18px;font-weight:700;font-size:18px;width:100%;cursor:pointer}
.btn.sub{background:#fff;color:var(--ink)}
.btn.small{min-height:44px;font-size:15px;width:auto;padding:8px 14px}
.btn:disabled{opacity:.35;cursor:default}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;font-size:16px;min-height:44px;cursor:pointer}

.card{background:#fff;border:2px solid var(--ink);border-radius:var(--r);padding:18px 16px;box-shadow:4px 4px 0 var(--ink)}
.card.slim{box-shadow:none}
.en{font-family:var(--en);font-weight:800;font-size:44px;line-height:1.2;word-break:break-word}
.mark{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 .08em}
.jp{font-size:28px;font-weight:800;line-height:1.35}
.jp2{font-size:18px;color:var(--soft);margin-top:8px}
.sent{font-family:var(--en);font-size:24px;font-weight:600;line-height:1.45}
.tr{color:var(--soft);font-size:16px;margin-top:8px}
.note{font-size:14px;font-weight:700;color:var(--soft)}
.hint{font-size:14px;color:var(--soft)}
.row{display:flex;justify-content:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{font-weight:700;font-size:14px;color:var(--soft)}
.big{font-size:30px;font-weight:800;line-height:1.3}
.meta{font-size:18px;font-weight:700}
.soft{color:var(--soft);font-weight:500;font-size:15px}

.gate{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.gmsg{font-weight:700;text-align:center}
.meter{height:16px;border-radius:8px;background:#fff;border:2px solid var(--ink);overflow:hidden}
.meter b{display:block;height:100%;width:0;background:var(--mark);transition:width .06s linear}
.meter.ok b{width:100%;background:var(--ok)}
.gate .manual{align-self:center}

.sheet-wrap{position:relative;border-radius:10px;overflow:hidden;border:2px solid var(--ink);background:#fff}
.back{padding:16px;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.sheet{position:absolute;inset:0;width:100%;border:0;background:var(--sheet);color:#fff;font-weight:800;font-size:18px;
  transition:opacity .25s,transform .25s;cursor:pointer}
.sheet.off{opacity:0;transform:translateX(35%);pointer-events:none}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{font-size:16px;padding:8px 4px;min-height:58px}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{min-height:28px;font-weight:800;text-align:center;border-radius:10px;padding:4px 8px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.answer{min-height:68px;border:2px dashed var(--soft);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;background:rgba(255,255,255,.7)}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{min-height:46px;padding:6px 14px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);
  font-family:var(--en);font-weight:700;font-size:20px;cursor:pointer}
input.spell{width:100%;font-family:var(--en);font-size:30px;font-weight:700;padding:12px;text-align:center;
  border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
textarea.box{width:100%;min-height:90px;border:2px solid var(--ink);border-radius:12px;padding:10px;font-size:16px;background:#fff;color:var(--ink)}
input.tel{width:100%;font-size:18px;padding:10px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}

.app-title{font-size:46px;font-weight:800;line-height:1.1}
.seg-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.seg{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;min-height:48px;font-size:18px;font-weight:700;cursor:pointer}
.seg.on{background:var(--mark)}
.srow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.srow:last-child{border-bottom:0}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;margin-top:4px}
.clock{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;margin-top:6px}
.item{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.item small{color:var(--soft);display:block}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h2{margin:6px 0 0;font-size:18px}
label.chk{display:flex;gap:10px;align-items:flex-start;font-weight:700}
label.chk input{width:24px;height:24px;margin-top:3px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;z-index:20;font-size:15px;font-weight:700}
.idle{position:fixed;inset:0;background:rgba(22,38,74,.82);color:#fff;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:24px;font-size:22px;font-weight:800;z-index:30}
@media (prefers-reduced-motion:reduce){.sheet,.meter b{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>

<!-- 単語データ(試作用の仮データ20語)。word=英語 / meaning=意味 / ex1,ex2=例文 / tr1,tr2=日本語訳。例文には必ず word をそのままの形で含めること -->

<script>
'use strict';
/* ================= 基本 ================= */
const APP_V=1, KEY='eitan.v1', IDLE_MS=60000;
const STEP_ORDER=['review','learn','check1','use','check2','spell'];
const STEP_NAMES={review:'復習',learn:'覚える',check1:'確認①',use:'使ってみよう',check2:'確認②',spell:'スペル'};
const INTERVALS=[0,1,3,7,14,30];   // 箱1〜5 → 次の復習までの日数
const WD=['日','月','火','水','木','金','土'];
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
const $=(s,el=document)=>el.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const num=(x,d=0)=>{x=Number(x);return Number.isFinite(x)&&x>=0?x:d;};

function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if(v===true) e.setAttribute(k,'');
    else e.setAttribute(k,v);
  }
  for(const kid of kids.flat(Infinity)){
    if(kid==null||kid===false) continue;
    e.append(kid.nodeType?kid:document.createTextNode(String(kid)));
  }
  return e;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const wordRe=w=>new RegExp('\\b'+esc(w)+'\\b','i');
function hl(sentence,word){
  const m=sentence.match(wordRe(word)); if(!m) return [sentence];
  return [sentence.slice(0,m.index),h('span',{class:'mark'},m[0]),sentence.slice(m.index+m[0].length)];
}
function ymd(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(s,n){const [y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+n));}
function fmtDur(ms){const s=Math.round(ms/1000);return Math.floor(s/60)+':'+pad(s%60);}
function fmtDurJp(ms){const s=Math.round(ms/1000),m=Math.floor(s/60);return m>0?m+'分'+pad(s%60)+'秒':s+'秒';}
const isIOS=()=>/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

const WORDS=JSON.parse($('#wordData').textContent);
const BYWORD=Object.fromEntries(WORDS.map(w=>[w.word,w]));

/* ================= 保存データ ================= */
function defaultState(){return {app:'eitan',v:APP_V,settings:{perDay:10,parentPhone:'',voiceCheck:true},words:{},sessions:[]};}
function cleanSession(s){
  const sm={}; for(const k of STEP_ORDER) sm[k]=num(s.stepMs&&s.stepMs[k]);
  return {id:String(s.id||'').slice(0,40),date:s.date,finishedAt:num(s.finishedAt),newN:num(s.newN),reviewN:num(s.reviewN),
    stepMs:sm,totalMs:num(s.totalMs),correct:num(s.correct),total:num(s.total),voiceN:num(s.voiceN),manualN:num(s.manualN),
    voiceMode:s.voiceMode==='on'?'on':'off'};
}
function validateBackup(o){
  if(!o||typeof o!=='object'||Array.isArray(o)) return {ok:false,error:'データの形式が正しくありません'};
  if(o.app!=='eitan') return {ok:false,error:'えいたんのバックアップではありません'};
  if(o.v!==APP_V) return {ok:false,error:'このバックアップは読み込めません(バージョンがちがいます)'};
  const st=defaultState(), se=(o.settings&&typeof o.settings==='object')?o.settings:{};
  st.settings.perDay=se.perDay===15?15:10;
  st.settings.parentPhone=typeof se.parentPhone==='string'?se.parentPhone.replace(/[^0-9+]/g,'').slice(0,20):'';
  st.settings.voiceCheck=se.voiceCheck!==false;
  if(o.words!==undefined&&(o.words===null||typeof o.words!=='object'||Array.isArray(o.words))) return {ok:false,error:'単語の記録がこわれています'};
  for(const [k,w] of Object.entries(o.words||{})){
    if(!/^[A-Za-z][A-Za-z' -]{0,39}$/.test(k)||!w||typeof w!=='object') continue;
    const box=Math.floor(Number(w.box)), due=String(w.due||'');
    if(!(box>=1&&box<=5)||!DATE_RE.test(due)) continue;
    st.words[k]={box,due,learnedOn:DATE_RE.test(String(w.learnedOn))?w.learnedOn:due};
  }
  if(o.sessions!==undefined&&!Array.isArray(o.sessions)) return {ok:false,error:'学習の記録がこわれています'};
  for(const s of (o.sessions||[])){
    if(!s||typeof s!=='object'||!DATE_RE.test(String(s.date))) continue;
    st.sessions.push(cleanSession(s));
  }
  st.sessions=st.sessions.slice(-2000);
  return {ok:true,state:st};
}
let LOAD_WARN=false;
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){return defaultState();}
  if(!raw) return defaultState();
  try{const r=validateBackup(JSON.parse(raw)); if(r.ok) return r.state;}catch(e){}
  // 読み込めない記録は、消さずに別のキーへ退避してから初期化する
  try{localStorage.setItem(KEY+'.broken',raw);}catch(e){}
  LOAD_WARN=true;return defaultState();
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('保存できませんでした');}}

function streak(){
  const days=new Set(S.sessions.map(s=>s.date)); let d=ymd(); if(!days.has(d)) d=addDays(d,-1);
  let n=0; while(days.has(d)){n++; d=addDays(d,-1);} return n;
}
function pickNew(n){return WORDS.filter(w=>!S.words[w.word]).slice(0,n).map(w=>w.word);}
function dueWords(){
  const t=ymd();
  return Object.entries(S.words).filter(([k,v])=>v.due<=t&&BYWORD[k]).sort((a,b)=>a[1].due<b[1].due?-1:a[1].due>b[1].due?1:0)
    .map(([k])=>k).slice(0,10);
}

/* ================= 表示の道具 ================= */
function mount(node){$('#app').replaceChildren(node);window.scrollTo(0,0);}
function toast(msg){const t=h('div',{class:'toast'},msg);document.body.append(t);setTimeout(()=>t.remove(),2200);}
function showIdle(){$('#layer').replaceChildren(h('div',{class:'idle',onclick:hideIdle},'ちょっと休けい中。タップでつづけるよ'));}
function hideIdle(){$('#layer').replaceChildren();}

/* ================= 学習時間(画面が見えていて、操作がある間だけ数える) ================= */
const Time={
  step:null,ms:{},last:0,lastActive:0,paused:false,timer:null,
  start(){this.ms={};for(const k of STEP_ORDER)this.ms[k]=0;this.last=this.lastActive=performance.now();this.paused=false;
    clearInterval(this.timer);this.timer=setInterval(()=>this.tick(),500);},
  setStep(k){this.tick();this.step=k;},
  touch(src){this.lastActive=performance.now();this.paused=false;if(src!=='p')hideIdle();},
  tick(){
    const now=performance.now(),dt=Math.min(now-this.last,1000);this.last=now;
    if(!this.step) return;
    const vis=document.visibilityState==='visible',idle=(now-this.lastActive)>IDLE_MS;
    if(vis&&!idle) this.ms[this.step]+=dt;
    else if(vis&&idle&&!this.paused){this.paused=true;showIdle();}
  },
  total(){return STEP_ORDER.reduce((a,k)=>a+(this.ms[k]||0),0);},
  stop(){clearInterval(this.timer);this.timer=null;this.step=null;this.paused=false;hideIdle();}
};
document.addEventListener('pointerdown',()=>Time.touch('p'),true);
document.addEventListener('keydown',()=>Time.touch('k'),true);

/* ================= 声の検知(内容は判定しない・録音しない・送信しない) ================= */
const Voice={
  ready:false,failed:false,stream:null,ctx:null,an:null,buf:null,timer:null,
  noise:0.006,speaking:false,quietUntil:0,gate:null,lastT:0,
  async init(){
    if(this.ready) return true; if(this.failed) return false;
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('nomic');
      const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false}});
      const AC=window.AudioContext||window.webkitAudioContext; const ctx=new AC();
      if(ctx.state==='suspended') await ctx.resume().catch(()=>{});
      const an=ctx.createAnalyser(); an.fftSize=1024; ctx.createMediaStreamSource(stream).connect(an);
      this.stream=stream;this.ctx=ctx;this.an=an;this.buf=new Float32Array(an.fftSize);this.ready=true;
      this.lastT=performance.now();clearInterval(this.timer);this.timer=setInterval(()=>this.tick(),50);
      return true;
    }catch(e){this.failed=true;return false;}
  },
  setSpeaking(b){this.speaking=b;if(!b)this.quietUntil=performance.now()+450;},
  tick(){
    const now=performance.now(),dt=now-this.lastT;this.lastT=now;
    if(!this.ready||!this.an) return;
    this.an.getFloatTimeDomainData(this.buf);
    let s=0;for(let i=0;i<this.buf.length;i++)s+=this.buf[i]*this.buf[i];
    const rms=Math.sqrt(s/this.buf.length),thr=Math.max(0.012,this.noise*3),muted=this.speaking||now<this.quietUntil;
    if(!muted&&rms<thr) this.noise=this.noise*0.97+rms*0.03;
    const g=this.gate; if(!g) return;
    if(g.meter) g.meter.style.width=muted?'0%':Math.min(100,Math.round(rms/(thr*2.5)*100))+'%';
    if(muted||g.done) return;
    if(rms>thr){g.acc+=dt;Time.touch('v');} else g.acc=Math.max(0,g.acc-dt*0.5);
    if(g.acc>=g.need){g.done=true;g.pass();}
  },
  listen(need,meter,pass){
    const g={need,acc:0,done:false,meter,pass};this.gate=g;
    return ()=>{if(this.gate===g)this.gate=null;};
  },
  stop(){
    clearInterval(this.timer);this.timer=null;this.gate=null;
    try{this.stream&&this.stream.getTracks().forEach(t=>t.stop());}catch(e){}
    try{this.ctx&&this.ctx.close();}catch(e){}
    this.stream=this.ctx=this.an=null;this.ready=false;this.failed=false;this.speaking=false;
  },
  async restart(){const g=this.gate;this.stop();await this.init();this.gate=g;}
};
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||!session||!Voice.ready) return;
  const t=Voice.stream&&Voice.stream.getAudioTracks()[0];
  if(!t||t.readyState==='ended') Voice.restart();
  else if(Voice.ctx&&Voice.ctx.state!=='running') Voice.ctx.resume().catch(()=>{});
});

/* ================= 読み上げ ================= */
const TTS={
  id:0,
  pick(){
    const vs=speechSynthesis.getVoices(); if(!vs.length) return null;
    const en=vs.filter(v=>/^en[-_]US/i.test(v.lang));
    return en.find(v=>/samantha|ava|allison|nicky|karen/i.test(v.name))||en[0]||vs.find(v=>/^en/i.test(v.lang))||null;
  },
  unlock(){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}},
  stop(){this.id++;try{speechSynthesis.cancel();}catch(e){}Voice.setSpeaking(false);},
  speak(text,rate=0.85){
    return new Promise(res=>{
      if(!('speechSynthesis' in window)){res();return;}
      const id=++this.id;
      try{
        if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
        const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;
        const v=this.pick();if(v)u.voice=v;
        let done=false;
        const fin=()=>{if(done)return;done=true;clearTimeout(tm);if(id===this.id)Voice.setSpeaking(false);res();};
        u.onend=fin;u.onerror=fin;
        const tm=setTimeout(fin,2000+text.length*150);
        Voice.setSpeaking(true);speechSynthesis.speak(u);
      }catch(e){if(id===this.id)Voice.setSpeaking(false);res();}
    });
  }
};
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=()=>{};

/* 声ゲート:声が出るまで「つぎへ」を押せない。マイクが使えない時は「言った」ボタンで進む */
function makeGate(onPass,need=400){
  const bar=h('b'),meter=h('div',{class:'meter'},bar),msg=h('div',{class:'gmsg'});
  const manual=h('button',{class:'btn sub small manual',style:'display:none'},'言った');
  const el=h('div',{class:'gate'},msg,meter,manual);
  let cancel=()=>{},timer=null,finished=false;
  function pass(kind){
    if(finished) return; finished=true; cancel(); clearTimeout(timer);
    if(kind==='voice') session.voiceN++; else session.manualN++;
    meter.classList.add('ok'); msg.textContent='OK!'; manual.style.display='none'; onPass(kind);
  }
  if(S.settings.voiceCheck&&Voice.ready){
    msg.textContent='声に出して言ってね';
    cancel=Voice.listen(need,bar,()=>pass('voice'));
    timer=setTimeout(()=>{manual.textContent='声が反応しないとき:言った';manual.style.display='';},10000);
  }else{
    meter.style.display='none';
    msg.textContent=S.settings.voiceCheck?'マイクが使えないので、言ったらボタンを押してね':'声に出して言ったら、ボタンを押してね';
    manual.style.display='';
  }
  manual.addEventListener('click',()=>pass('manual'));
  return {el,destroy(){finished=true;cancel();clearTimeout(timer);}};
}

/* ① 覚える:単語+意味を、音を聞いて声に出す ×3周 */

function learnCard(word,n,total,r,rounds){

/* フラッシュカード(赤シート):日本語を見て英語を思い出す → 赤シートをタップして答え合わせ → ◯△× */
function flashCard(stepKey,word,pos,total,mode){
  const d=BYWORD[word];
  return waitUI(resolve=>{
    let finished=false;
    const fin=r=>{if(finished)return;finished=true;TTS.stop();resolve(r);};
    const rate=h('div',{class:'rate',style:'visibility:hidden'},
      h('button',{class:'btn good',onclick:()=>fin('ok')},'◯ 言えた'),
      h('button',{class:'btn sub',onclick:()=>fin('maybe')},'△ あやしい'),
      h('button',{class:'btn sub',onclick:()=>fin('ng')},'× わからない'));
    const sheet=h('button',{class:'sheet'},'タップして答えを見る');
    sheet.addEventListener('click',()=>{
      sheet.classList.add('off');rate.style.visibility='visible';
      TTS.speak(d.word).then(()=>{if(mode==='sentence'&&!finished)return TTS.speak(d.ex1,0.8);});
    });
    const front=mode==='sentence'?[h('div',{class:'jp'},d.meaning),h('div',{class:'jp2'},d.tr1)]:[h('div',{class:'jp'},d.meaning)];
    const back=mode==='sentence'?[h('div',{class:'en'},h('span',{class:'mark'},d.word)),h('div',{class:'sent'},hl(d.ex1,d.word))]
                                :[h('div',{class:'en'},h('span',{class:'mark'},d.word))];
    mount(chrome(stepKey,pos,total,
      h('div',{class:'note'},mode==='sentence'?'英語の単語と例文を声に出して思い出そう':'英語を声に出して思い出そう'),
      h('div',{class:'card'},front),
      h('div',{class:'sheet-wrap'},h('div',{class:'back'},back),sheet),
      h('div',{class:'grow'}),rate));
  });
}
async function runCards(stepKey,words,mode){
  const queue=shuffle(words),tries={},first={},total=words.length;let done=0;
  while(queue.length){
    const w=queue.shift();tries[w]=(tries[w]||0)+1;
    const r=await flashCard(stepKey,w,Math.min(done+1,total),total,mode);
    if(first[w]===undefined) first[w]=r;
    if(r==='ok'||tries[w]>=3) done++; else queue.splice(Math.min(queue.length,3),0,w);
  }
  return first;
}
async function stepReview(){Time.setStep('review');session.reviewFirst=await runCards('review',session.reviewWords,'meaning');}
async function stepCheck1(){Time.setStep('check1');await runCards('check1',session.newWords,'meaning');}
async function stepCheck2(){Time.setStep('check2');await runCards('check2',session.newWords,'sentence');}

/* ③ 使ってみよう:例文を読む ×2周 → 穴埋め → 並べ替え */
async function stepUse(){
  Time.setStep('use');
  const words=session.newWords,total=words.length*4;let n=0;
  for(let k=1;k<=2;k++) for(const w of shuffle(words)){n++;await readCard(w,k,n,total);}
  for(const w of shuffle(words)){n++;await clozeCard(w,words,n,total);}
  for(const w of shuffle(words)){n++;await orderCard(w,n,total);}
}
function readCard(word,k,n,total){
  const d=BYWORD[word];
  return waitUI(resolve=>{
    const next=h('button',{class:'btn',disabled:true,onclick:()=>{gate.destroy();TTS.stop();resolve();}},'つぎへ');
    const gate=makeGate(()=>{next.disabled=false;});
    const play=()=>TTS.speak(d.ex1,0.8);
    mount(chrome('use',n,total,
      h('div',{class:'note'},'例文を読もう('+k+'回目 / 2回)'),
      h('div',{class:'card'},h('div',{class:'sent'},hl(d.ex1,d.word)),h('div',{class:'tr'},d.tr1)),
      h('div',{class:'row'},h('button',{class:'btn sub small',onclick:play},'🔊 聞く')),
      h('div',{class:'hint'},'音を聞いて、まねして声に出して読もう'),
      gate.el,h('div',{class:'grow'}),next));
    play();
  });
}
function distractors(word,pool){
  const others=shuffle(pool.filter(w=>w!==word));
  const extra=shuffle(WORDS.map(x=>x.word).filter(w=>w!==word&&!others.includes(w)));
  return others.concat(extra).slice(0,3);
}
function clozeCard(word,pool,n,total){
  const d=BYWORD[word],opts=shuffle([word,...distractors(word,pool)]);
  return waitUI(resolve=>{
    let attempted=false,solved=false;
    const fb=h('div',{class:'fb'}),sentEl=h('div',{class:'sent'},d.ex2.replace(wordRe(word),'_____'));
    const next=h('button',{class:'btn',disabled:true,onclick:()=>{TTS.stop();resolve();}},'つぎへ');
    const grid=h('div',{class:'choices'});
    opts.forEach(o=>{
      const b=h('button',{class:'btn sub'},o);
      b.addEventListener('click',()=>{
        if(solved) return;
        const good=o===word; if(!attempted){attempted=true;addAcc(good);}
        if(good){
          solved=true;b.classList.add('good');fb.className='fb ok';fb.textContent='せいかい!';
          sentEl.replaceChildren(...hl(d.ex2,d.word));next.disabled=false;TTS.speak(d.ex2,0.8);
        }else{b.classList.add('bad');b.disabled=true;fb.className='fb bad';fb.textContent='ちがうよ。もう一度えらんでね';}
      });
      grid.append(b);
    });
    mount(chrome('use',n,total,
      h('div',{class:'note'},'あてはまる単語をえらぼう'),
      h('div',{class:'card'},sentEl,h('div',{class:'tr'},d.tr2)),
      grid,fb,h('div',{class:'grow'}),next));
  });
}
function orderCard(word,n,total){
  const d=BYWORD[word],tokens=d.ex1.split(' ');
  let order=shuffle(tokens.map((t,i)=>({t,i}))),guard=0;
  while(order.every((o,i)=>o.t===tokens[i])&&guard++<10) order=shuffle(order);
  return waitUI(resolve=>{
    const picked=[];let attempted=false,solved=false;
    const ans=h('div',{class:'answer'}),pool=h('div',{class:'tiles'}),fb=h('div',{class:'fb'});
    const next=h('button',{class:'btn',disabled:true,onclick:()=>{TTS.stop();resolve();}},'つぎへ');
    const clear=h('button',{class:'btn sub small',onclick:()=>{if(solved)return;picked.length=0;render();}},'やり直す');
    function render(){
      ans.replaceChildren(...picked.map(o=>h('button',{class:'tile',onclick:()=>{if(solved)return;picked.splice(picked.indexOf(o),1);render();}},o.t)));
      pool.replaceChildren(...order.filter(o=>!picked.includes(o)).map(o=>h('button',{class:'tile',onclick:()=>{if(solved)return;picked.push(o);render();check();}},o.t)));
    }
    function check(){
      if(picked.length!==order.length) return;
      const good=picked.map(o=>o.t).join(' ')===d.ex1;
      if(!attempted){attempted=true;addAcc(good);}
      if(good){solved=true;fb.className='fb ok';fb.textContent='せいかい!';next.disabled=false;TTS.speak(d.ex1,0.8);}
      else{fb.className='fb bad';fb.textContent='ちがうよ。タップして直してみよう';}
    }
    render();
    mount(chrome('use',n,total,
      h('div',{class:'note'},'日本語に合う英文をつくろう'),
      h('div',{class:'card'},h('div',{class:'jp',style:'font-size:22px'},d.tr1)),
      ans,pool,fb,h('div',{class:'row'},clear),h('div',{class:'grow'}),next));
  });
}

/* ⑤ スペル入力 */
async function stepSpell(){
  Time.setStep('spell');
  const words=shuffle(session.newWords);
  for(let i=0;i<words.length;i++) await spellCard(words[i],i+1,words.length);
}
function spellCard(word,n,total){
  const d=BYWORD[word];
  return waitUI(resolve=>{
    let attempted=false,solved=false;
    const input=h('input',{class:'spell',type:'text',autocapitalize:'none',autocomplete:'off',autocorrect:'off',spellcheck:'false',enterkeyhint:'done','aria-label':'つづり'});
    const fb=h('div',{class:'fb'});
    const btn=h('button',{class:'btn',onclick:submit},'答え合わせ');
    input.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
    function submit(){
      if(solved){TTS.stop();resolve();return;}
      const v=input.value.trim().toLowerCase(); if(!v) return;
      const good=v===d.word.toLowerCase();
      if(!attempted){attempted=true;addAcc(good);}
      if(good){solved=true;fb.className='fb ok';fb.textContent='せいかい!';input.disabled=true;btn.textContent='つぎへ';TTS.speak(d.word);}
      else{fb.className='fb bad';fb.textContent='ざんねん。正しいつづりは「'+d.word+'」。もう一度書いてみよう';input.value='';input.focus();}
    }
    mount(chrome('spell',n,total,
      h('div',{class:'note'},'つづりを書こう'),
      h('div',{class:'card'},h('div',{class:'jp'},d.meaning)),
      h('div',{class:'row'},h('button',{class:'btn sub small',onclick:()=>TTS.speak(d.word)},'🔊 発音を聞く')),
      input,fb,h('div',{class:'grow'}),btn));
    setTimeout(()=>input.focus(),60);
  });
}

/* ================= セッションの開始と終了 ================= */
function endSession(){Time.stop();Voice.stop();TTS.stop();session=null;}
async function start(newW,due){
  TTS.unlock();
  session={newWords:newW,reviewWords:due,steps:[],correct:0,total:0,voiceN:0,manualN:0,reject:null,quit:false,reviewFirst:{}};
  session.steps=[...(due.length?['review']:[]),...(newW.length?['learn','check1','use','check2','spell']:[])];
  mount(h('div',{class:'screen'},h('div',{class:'big'},'じゅんび中…'),
    S.settings.voiceCheck?h('div',{class:'hint'},'マイクを使います。声が出ているかを調べるだけで、録音や送信はしません。許可のメッセージが出たら「許可」を押してね。'):null));
  if(S.settings.voiceCheck) await Voice.init();
  Time.start();
  try{
    if(due.length) await stepReview();
    if(newW.length){await stepLearn();await stepCheck1();await stepUse();await stepCheck2();await stepSpell();}
    finishSession();
  }catch(e){
    const quit=e&&e.message==='abort';
    if(!quit) console.error(e);
    endSession(); if(!quit) toast('エラーが起きました'); showHome();
  }
}
function finishSession(){
  const now=Date.now(),today=ymd();
  for(const w of session.newWords) S.words[w]={box:1,due:addDays(today,1),learnedOn:today};
  for(const w of session.reviewWords){
    const st=S.words[w]; if(!st) continue;
    if(session.reviewFirst[w]==='ok'){st.box=Math.min(st.box+1,5);st.due=addDays(today,INTERVALS[st.box]);}
    else{st.box=1;st.due=addDays(today,1);}
  }
  const rec={id:String(now),date:today,finishedAt:now,newN:session.newWords.length,reviewN:session.reviewWords.length,
    stepMs:Object.assign({},Time.ms),totalMs:Time.total(),correct:session.correct,total:session.total,
    voiceN:session.voiceN,manualN:session.manualN,voiceMode:Voice.ready?'on':'off'};
  S.sessions.push(rec);S.sessions=S.sessions.slice(-2000);save();
  endSession();showDone(rec);
}

/* ================= 完了画面・メッセージ ================= */
function buildMessage(rec){
  const d=new Date(rec.finishedAt||Date.now()),L=[];
  L.push('【英単語 完了】');
  L.push((d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+') '+pad(d.getHours())+':'+pad(d.getMinutes()));
  L.push('新しい単語'+rec.newN+'語'+(rec.reviewN?' + 復習'+rec.reviewN+'語':''));
  L.push('学習時間 '+fmtDurJp(rec.totalMs));
  if(rec.total) L.push('正答率 '+Math.round(rec.correct/rec.total*100)+'%('+rec.correct+'/'+rec.total+')');
  const parts=STEP_ORDER.filter(k=>rec.stepMs[k]>0).map(k=>STEP_NAMES[k]+' '+fmtDur(rec.stepMs[k]));
  if(parts.length) L.push('内訳 '+parts.join(' / '));
  L.push(rec.voiceMode==='on'?'声チェック 検知'+rec.voiceN+'回 / 手動'+rec.manualN+'回':'声チェック なし(手動'+rec.manualN+'回)');
  const st=streak(); if(st>0) L.push('連続'+st+'日目');
  return L.join('\n');
}

  const p=S.settings.parentPhone;
  location.href='sms:'+p+(isIOS()?'&':'?')+'body='+encodeURIComponent(text);

async function copy(text){

    h('div',{class:'grow'}),
    h('button',{class:'btn',onclick:()=>openSms(msg)},'メッセージで送る'),
    S.settings.parentPhone?null:h('div',{class:'hint'},'送り先は「設定」で登録できます'),

  else if(!newW.length&&!due.length) main=[h('div',{class:'card'},h('div',{class:'big'},'今日の分はおしまい'),h('div',{class:'meta soft'},'新しい単語がありません。単語リストを増やしてね。'))];
  else main=[h('div',{class:'card'},h('div',{class:'lbl'},'1日に覚える新しい単語'),h('div',{class:'seg-row'},seg),
                h('div',{class:'meta'},'今日:新しい単語 '+newW.length+'語'+(due.length?' + 復習 '+due.length+'語':'')),
                h('div',{class:'meta soft'},'目安 約'+Math.max(1,Math.round(newW.length*1.4+due.length*0.4))+'分')),
             h('button',{class:'btn',onclick:()=>start(newW,due)},'はじめる')];
  mount(h('div',{class:'screen'},
    h('div',null,h('div',{class:'app-title'},h('span',{class:'mark'},'えいたん')),
      h('div',{class:'meta soft'},(d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'+(st>0?'　連続 '+st+'日':''))),
    main,h('div',{class:'grow'}),
    h('div',{class:'row2'},h('button',{class:'btn sub',onclick:showHistory},'きろく'),h('button',{class:'btn sub',onclick:showSettings},'設定'))));
}
function showHistory(){
  const rows=S.sessions.slice().reverse().slice(0,60).map(s=>{
    const [y,m,dd]=s.date.split('-').map(Number),wd=WD[new Date(y,m-1,dd).getDay()];
    const t=s.finishedAt?new Date(s.finishedAt):null;
    return h('div',{class:'item'},
      h('b',null,m+'/'+dd+'('+wd+')'+(t?' '+pad(t.getHours())+':'+pad(t.getMinutes()):'')),
      h('small',null,'新'+s.newN+'語'+(s.reviewN?' + 復習'+s.reviewN+'語':'')+' / '+fmtDurJp(s.totalMs)+(s.total?' / 正答率'+Math.round(s.correct/s.total*100)+'%':'')));
  });
  mount(h('div',{class:'screen'},topBack('きろく'),h('div',{class:'meta'},'連続 '+streak()+'日'),
    rows.length?h('div',null,rows):h('div',{class:'note'},'まだ記録がありません')));
}
function exportJSON(){return JSON.stringify({app:'eitan',v:APP_V,exportedAt:new Date().toISOString(),settings:S.settings,words:S.words,sessions:S.sessions},null,1);}
async function shareBackup(){
  const json=exportJSON(),name='eitan-backup-'+ymd().replace(/-/g,'')+'.json';
  for(const type of ['application/json','text/plain']){
    try{
      const f=new File([json],name,{type});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return;}
    }catch(e){if(e&&e.name==='AbortError')return;}
  }
  const a=h('a',{href:URL.createObjectURL(new Blob([json],{type:'application/json'})),download:name});
  document.body.append(a);a.click();a.remove();
}
function importFrom(text){
  if(!text.trim()) return toast('バックアップを貼り付けるか、ファイルを選んでね');
  if(text.length>3000000) return toast('データが大きすぎます');
  let o; try{o=JSON.parse(text);}catch(e){return toast('読み込めませんでした(形式がちがいます)');}
  const r=validateBackup(o); if(!r.ok) return toast(r.error);
  const n=r.state.sessions.length,m=Object.keys(r.state.words).length;
  if(!confirm('学習 '+n+'回分、単語 '+m+'語の記録を読み込みます。\n今のデータは上書きされます。よろしいですか?')) return;
  S=r.state;save();toast('読み込みました');showHome();
}
function showSettings(){
  const tel=h('input',{class:'tel',type:'tel',inputmode:'tel',placeholder:'例: 09012345678',value:S.settings.parentPhone,'aria-label':'送り先の電話番号'});
  tel.addEventListener('input',()=>{S.settings.parentPhone=tel.value.replace(/[^0-9+]/g,'').slice(0,20);save();});
  const chk=h('input',{type:'checkbox'});chk.checked=S.settings.voiceCheck;
  chk.addEventListener('change',()=>{S.settings.voiceCheck=chk.checked;save();});
  const ta=h('textarea',{class:'box',placeholder:'バックアップの文字をここに貼り付け','aria-label':'バックアップ'});
  const file=h('input',{type:'file',accept:'.json,application/json,text/plain'});
  file.addEventListener('change',async()=>{const f=file.files&&file.files[0];if(f){try{ta.value=await f.text();}catch(e){toast('ファイルを読めませんでした');}}});
  mount(h('div',{class:'screen'},topBack('設定・バックアップ'),
    h('div',{class:'sec'},h('h2',null,'メッセージの送り先'),tel,h('div',{class:'hint'},'完了画面の「メッセージで送る」で、この番号あてのメッセージが開きます。')),
    h('div',{class:'sec'},h('h2',null,'声チェック'),
      h('label',{class:'chk'},chk,h('span',null,'マイクで声が出ているかを調べる')),
      h('div',{class:'hint'},'声の大きさだけを見ます。内容の判定・録音・送信はしません。')),
    h('div',{class:'sec'},h('h2',null,'バックアップ(書き出し)'),
      h('button',{class:'btn sub',onclick:shareBackup},'ファイルとして保存・送る'),
      h('button',{class:'btn sub',onclick:()=>copy(exportJSON())},'文字としてコピー')),
    h('div',{class:'sec'},h('h2',null,'バックアップ(読み込み)'),file,ta,
      h('button',{class:'btn',onclick:()=>importFrom(ta.value)},'読み込む(今のデータは上書き)')),
    h('div',{class:'hint'},'えいたん 試作版 / 単語 '+WORDS.length+'語')));
}

showHome();
if(LOAD_WARN) toast('きろくを読み込めませんでした。設定のバックアップから戻せます');
</script>
</body>
</html>
